name: Refresh forecasts and deploy
on:
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: 'Lightweight schedule-only or full PBP/injury refresh'
        required: true
        type: choice
        options:
          - schedules-only
          - full
        default: full
  schedule:
    - cron: '19 7 * * *' # daily full player and injury refresh
    - cron: '19 13,19,23 * * *' # lighter schedule-only refreshes
  push:
    branches: [main]
    paths-ignore:
      - 'data/dashboard.json'
      - 'data/predictions-log.json'
      - 'data/full-model-audit.json'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nfl-lab-pages
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional parquet reader
        run: python -m pip install 'polars>=1.0,<2'
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
      - name: Refresh NFL schedule and model audit
        env:
          REFRESH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_mode || (github.event_name == 'schedule' && github.event.schedule == '19 13,19,23 * * *' && 'schedules-only') || 'full' }}
        run: |
          if [ "$REFRESH_MODE" = 'full' ]; then
            python scripts/update.py
          else
            python scripts/update.py --schedules-only
          fi
      - name: Commit immutable prospective picks and dashboard snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dashboard.json data/predictions-log.json data/full-model-audit.json
          git diff --cached --quiet || (git commit -m 'Refresh verified NFL forecast snapshot' && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
